<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar senha | Agenda Fácil</title>
    <link rel="icon" type="image/png" href="../../img/logo.png">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="../../styles/style.css">
    <link rel="stylesheet" href="../../styles/auth.css">
</head>
<body>
<header>
    <nav class="navbar" aria-label="Navegação principal">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center gap-2" href="../index.html">
                <img src="../../img/logo.png" alt="" width="40" height="40">
                <span>Agenda <span class="marca-destaque">Fácil</span></span>
            </a>
            <a class="btn btn-outline-primary" href="login.html">Entrar</a>
        </div>
    </nav>
</header>

<main class="pa-fundo">
    <form class="pa-cartao" data-acao="recuperar" novalidate aria-labelledby="titulo">
        <a class="pa-logo" href="../index.html">
            <img src="../../img/logo.png" alt="" width="36" height="36">
            <span>Agenda <span class="marca-destaque">Fácil</span></span>
        </a>
        <h1 id="titulo">Recuperar senha</h1>
        <p class="pa-sub">Informe o e-mail da sua conta. Enviaremos um link para você criar uma nova senha.</p>

        <div class="pa-campo">
            <label class="form-label" for="email">E-mail</label>
            <input class="form-control" id="email" name="email" type="email" autocomplete="email" data-regra="email" aria-describedby="email-erro">
            <div class="pa-erro" id="email-erro" role="alert"></div>
        </div>

        <button class="btn btn-primary w-100 pa-enviar" type="submit">
            <span class="spinner-border spinner-border-sm d-none" aria-hidden="true"></span>
            <span>Enviar link</span>
        </button>

        <div class="pa-status" role="status" aria-live="polite"></div>

        <p class="pa-rodape"><a href="login.html">Voltar ao login</a></p>
    </form>
</main>

<script src="../../js/auth-ui.js"></script>
</body>
</html>
