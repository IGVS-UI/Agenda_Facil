<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar | Agenda Fácil</title>
    <link rel="icon" type="image/png" href="../../img/logo.png">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="../../styles/style.css">
    <link rel="stylesheet" href="../../styles/auth.css">
</head>
<body>
<header>
    <nav class="navbar" aria-label="Navegação principal">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center gap-2" href="../index.html">
                <img src="../../img/logo.png" alt="" width="40" height="40">
                <span>Agenda <span class="marca-destaque">Fácil</span></span>
            </a>
            <a class="btn btn-outline-primary" href="cadastro.html">Criar conta</a>
        </div>
    </nav>
</header>

<main class="pa-fundo">
    <form class="pa-cartao" data-acao="login" novalidate aria-labelledby="titulo">
        <a class="pa-logo" href="../index.html">
            <img src="../../img/logo.png" alt="" width="36" height="36">
            <span>Agenda <span class="marca-destaque">Fácil</span></span>
        </a>
        <h1 id="titulo">Entrar</h1>
        <p class="pa-sub">Acesse sua conta para agendar e acompanhar seus serviços.</p>

        <fieldset class="pa-perfil">
            <legend class="visually-hidden">Tipo de conta</legend>
            <input type="radio" class="btn-check" name="perfil" id="perfil-cliente" value="cliente" checked>
            <label class="btn btn-outline-primary" for="perfil-cliente">Sou cliente</label>
            <input type="radio" class="btn-check" name="perfil" id="perfil-profissional" value="profissional">
            <label class="btn btn-outline-primary" for="perfil-profissional">Sou profissional</label>
        </fieldset>

        <div class="pa-campo">
            <label class="form-label" for="email">E-mail</label>
            <input class="form-control" id="email" name="email" type="email" autocomplete="email" data-regra="email" aria-describedby="email-erro">
            <div class="pa-erro" id="email-erro" role="alert"></div>
        </div>

        <div class="pa-campo">
            <label class="form-label" for="senha">Senha</label>
            <div class="input-group">
                <input class="form-control" id="senha" name="senha" type="password" autocomplete="current-password" data-regra="senha" aria-describedby="senha-erro">
                <button type="button" class="btn btn-outline-secondary pa-olho" data-alvo="senha" aria-pressed="false" aria-label="Mostrar senha">Mostrar</button>
            </div>
            <div class="pa-erro" id="senha-erro" role="alert"></div>
        </div>

        <div class="pa-linha"><a href="recuperar-senha.html">Esqueci minha senha</a></div>

        <button class="btn btn-primary w-100 pa-enviar" type="submit">
            <span class="spinner-border spinner-border-sm d-none" aria-hidden="true"></span>
            <span>Entrar</span>
        </button>

        <div class="pa-ou" role="separator"><span>ou</span></div>
        <button type="button" class="btn pa-google" data-google>
            <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true" focusable="false"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
            <span class="pa-google-texto">Continuar com o Google</span>
        </button>

        <div class="pa-status" role="status" aria-live="polite"></div>

        <p class="pa-rodape">Ainda não tem conta? <a href="cadastro.html">Cadastre-se</a></p>
        <p class="pa-dica">Modo demonstração: <code>erro@teste.com</code> simula login recusado.</p>
    </form>
</main>

<script src="../../js/auth-ui.js"></script>
</body>
</html>
