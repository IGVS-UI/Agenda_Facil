<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meus serviços | Agenda Fácil</title>
    <link rel="icon" type="image/png" href="../img/logo.png">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="../styles/style.css">
    <link rel="stylesheet" href="../styles/app.css">
</head>
<body>
<a class="link-pular" href="#conteudo">Pular para o conteúdo</a>
<header>
    <nav class="navbar navbar-expand-lg" aria-label="Navegação principal">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center gap-2" href="agendamentos_profissional.html">
                <img src="../img/logo.png" alt="" width="40" height="40">
                <span>Agenda <span class="marca-destaque">Fácil</span></span>
            </a>
            <ul class="navbar-nav flex-row flex-wrap gap-3 gap-lg-4 ms-lg-4">
                <li class="nav-item"><a class="nav-link" href="agendamentos_profissional.html">Agendamentos</a></li>
                <li class="nav-item"><a class="nav-link active" aria-current="page" href="servicos_profissional.html">Meus serviços</a></li>
                <li class="nav-item"><a class="nav-link" href="disponibilidade_profissional.html">Disponibilidade</a></li>
            </ul>
            <div class="pc-usuario" id="nav-usuario"></div>
        </div>
    </nav>
</header>

<main class="container app-pagina" id="conteudo">
    <header class="pp-topo">
        <div>
            <p class="sobretitulo">Área do profissional</p>
            <h1>Meus serviços</h1>
        </div>
        <button type="button" class="btn btn-primary" id="novoServico">Novo serviço</button>
    </header>

    <p class="ps-sub">Os clientes só veem os serviços <strong>ativos</strong>. Desativar não apaga o serviço nem os agendamentos antigos.</p>

    <div class="pp-status-msg" id="mensagem" role="status" aria-live="polite"></div>

    <div class="table-responsive">
        <table class="table pv-tabela">
            <thead>
                <tr>
                    <th scope="col">Serviço</th>
                    <th scope="col">Duração</th>
                    <th scope="col">Preço</th>
                    <th scope="col">Situação</th>
                    <th scope="col"><span class="visually-hidden">Ações</span></th>
                </tr>
            </thead>
            <tbody id="listaServicos"></tbody>
        </table>
    </div>
</main>

<!-- Criar / editar serviço -->
<div class="modal fade" id="modalServico" tabindex="-1" aria-labelledby="modalServicoTitulo" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <form class="modal-content" id="formServico" novalidate>
            <div class="modal-header">
                <h2 class="modal-title fs-5" id="modalServicoTitulo">Novo serviço</h2>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
            </div>
            <div class="modal-body">
                <div class="mb-3">
                    <label class="form-label" for="nome">Nome do serviço</label>
                    <input class="form-control" id="nome" type="text" required aria-describedby="nome-erro">
                    <div class="pa-erro" id="nome-erro" role="alert"></div>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="categoria">Categoria</label>
                    <input class="form-control" id="categoria" type="text" list="categorias" required aria-describedby="categoria-erro">
                    <datalist id="categorias">
                        <option value="Barbearia"></option><option value="Beleza"></option>
                        <option value="Bem-estar"></option><option value="Saúde"></option>
                    </datalist>
                    <div class="pa-erro" id="categoria-erro" role="alert"></div>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="descricao">Descrição</label>
                    <textarea class="form-control" id="descricao" rows="2" required aria-describedby="descricao-erro"></textarea>
                    <div class="pa-erro" id="descricao-erro" role="alert"></div>
                </div>
                <div class="row g-3">
                    <div class="col-6">
                        <label class="form-label" for="duracao">Duração (min)</label>
                        <input class="form-control" id="duracao" type="number" min="5" step="5" required aria-describedby="duracao-erro">
                        <div class="pa-erro" id="duracao-erro" role="alert"></div>
                    </div>
                    <div class="col-6">
                        <label class="form-label" for="preco">Preço (R$)</label>
                        <input class="form-control" id="preco" type="number" min="0" step="0.01" required aria-describedby="preco-erro">
                        <div class="pa-erro" id="preco-erro" role="alert"></div>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button>
                <button type="submit" class="btn btn-primary">Salvar serviço</button>
            </div>
        </form>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/mock-data.js"></script>
<script src="../js/apiService.js"></script>
<script src="../js/comum.js"></script>
<script type="module" src="../js/authService.js"></script>
<script src="../js/servicos_profissional.js"></script>
</body>
</html>
